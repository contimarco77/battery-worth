[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "battery-worth"
version = "0.1.0"
description = "Would a home battery have paid off for YOU? Retrospective what-if analysis from your real energy data (Home Assistant friendly)."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Marco" }]
keywords = ["home-assistant", "solar", "battery", "energy", "roi", "photovoltaic"]
dependencies = [
    "pandas>=2.2",
    # Already a hard dependency of pandas, so this installs nothing new; declared
    # explicitly because tariffs.py imports dateutil.easter directly (movable
    # Easter Monday in the ARERA holiday calendar) rather than relying on it
    # transitively. Preferred over the `holidays` package: one function, no new wheel.
    "python-dateutil>=2.8.2",
    "pydantic>=2.7",
    "typer>=0.12",
    "jinja2>=3.1",
    "matplotlib>=3.9",
]

[project.urls]
# Kept in sync by hand with `battery_worth.REPO_URL`, which is what the card and
# the report actually print; a test pins the two together, since packaging
# metadata cannot import from the package it describes.
Homepage = "https://github.com/contimarco77/battery-worth"
Repository = "https://github.com/contimarco77/battery-worth"
Issues = "https://github.com/contimarco77/battery-worth/issues"

[project.optional-dependencies]
llm = ["anthropic>=0.34"]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "pandas-stubs",
    "types-python-dateutil",
]

[project.scripts]
battery-worth = "battery_worth.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/battery_worth"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "PL"]

[tool.ruff.lint.per-file-ignores]
# Tests assert literal expected values on purpose: the whole point of the
# hand-verifiable suite is that the number you check is visible at the assertion.
"tests/*" = ["PLR2004"]

[tool.mypy]
strict = true
python_version = "3.11"
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["matplotlib.*"]
ignore_missing_imports = true
